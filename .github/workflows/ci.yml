name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build machine passes nothing on to Astro's telemetry endpoint.
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Script tests
        run: bun run test:scripts

      - name: Content validation
        run: bun run validate:text

      - name: Authorship check (changed commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node scripts/check-attribution.mjs --range "FETCH_HEAD..HEAD"

      - name: Authorship check (full history)
        if: github.event_name != 'pull_request'
        run: node scripts/check-attribution.mjs

      - name: Build
        run: bun run build
